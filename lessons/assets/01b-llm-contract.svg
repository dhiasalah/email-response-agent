<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Lesson 01b: the LlmClient contract</title>
  <desc id="d">An agent builds an LlmRequest with two separate fields: trusted instructions and untrusted input. It calls the LlmClient interface. In the application the implementation is OllamaLlmClient (lesson 02); in tests it is FakeLlmClient, which lives in src/test. Both return raw model text, which is untrusted, to the shared LlmOutputParser: strict Jackson then Bean Validation. The agent gets either a validated record or a checked LlmException, which leads to escalation.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", system-ui, sans-serif; fill: #17191e; font-size: 13px; }
      .h { font-size: 20px; font-weight: 600; }
      .sub { font-size: 13px; fill: #62666f; }
      .code { font-family: Consolas, monospace; font-size: 12px; }
      .white { fill: #ffffff; font-weight: 600; }
      .wsmall { fill: #ffffff; font-size: 11.5px; }
      .small { font-size: 11.5px; }
      .muted { fill: #62666f; font-size: 12px; }
      .lbl { font-size: 12px; fill: #62666f; font-style: italic; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17191e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0531f"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fbeee6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c0531f" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="960" height="560" fill="#fffefb"/>
  <text x="24" y="36" class="h">Lesson 01b: one door to the model, and a strict guard on the way back</text>
  <text x="24" y="58" class="sub">Agents only know the interface. Whatever model sits behind it, its answer is untrusted until code has parsed and validated it.</text>

  <!-- Agent -->
  <rect x="24" y="100" width="180" height="70" rx="8" fill="#6b4fa0"/>
  <text x="114" y="128" text-anchor="middle" class="white">An agent</text>
  <text x="114" y="148" text-anchor="middle" class="wsmall">triage, writer, reviewer…</text>

  <!-- LlmRequest -->
  <rect x="250" y="88" width="250" height="118" rx="8" fill="#ffffff" stroke="#17191e" stroke-width="1.2"/>
  <text x="264" y="110" class="code" font-weight="600">LlmRequest (record)</text>
  <text x="264" y="130" class="code">agent · tier (FAST | STRONG)</text>
  <rect x="262" y="138" width="226" height="26" rx="5" fill="#2b5fa8"/>
  <text x="272" y="156" class="code" style="fill:#ffffff">instructions   trusted, ours</text>
  <rect x="262" y="170" width="226" height="26" rx="5" fill="url(#hatch)" stroke="#c0531f" stroke-width="1.2"/>
  <text x="272" y="188" class="code" style="fill:#c0531f">untrustedInput  email text</text>
  <line x1="204" y1="135" x2="248" y2="135" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Interface -->
  <rect x="550" y="100" width="200" height="70" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="650" y="128" text-anchor="middle" class="code" style="fill:#2b5fa8;font-weight:600">interface LlmClient</text>
  <text x="650" y="149" text-anchor="middle" class="code" style="font-size:11.5px">call(request, Type.class)</text>
  <line x1="500" y1="135" x2="548" y2="135" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Implementations -->
  <rect x="790" y="88" width="150" height="62" rx="8" fill="#2b5fa8"/>
  <text x="865" y="112" text-anchor="middle" class="white">OllamaLlmClient</text>
  <text x="865" y="131" text-anchor="middle" class="wsmall">src/main · lesson 02</text>
  <rect x="790" y="164" width="150" height="62" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.5"/>
  <text x="865" y="188" text-anchor="middle" font-weight="600" style="fill:#2b5fa8">FakeLlmClient</text>
  <text x="865" y="207" text-anchor="middle" class="small">src/test · today</text>
  <line x1="750" y1="125" x2="788" y2="119" stroke="#17191e" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="750" y1="145" x2="788" y2="190" stroke="#17191e" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="769" y="96" text-anchor="middle" class="lbl">app</text>
  <text x="772" y="222" text-anchor="middle" class="lbl">tests</text>

  <!-- Model -->
  <rect x="790" y="262" width="150" height="56" rx="8" fill="#6b4fa0"/>
  <text x="865" y="286" text-anchor="middle" class="white">qwen2.5 (Ollama)</text>
  <text x="865" y="304" text-anchor="middle" class="wsmall">or a queued answer</text>
  <line x1="865" y1="226" x2="865" y2="260" stroke="#17191e" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Raw text -->
  <rect x="560" y="262" width="180" height="56" rx="8" fill="url(#hatch)" stroke="#c0531f" stroke-width="1.5"/>
  <text x="650" y="286" text-anchor="middle" font-weight="600" style="fill:#c0531f">raw text</text>
  <text x="650" y="304" text-anchor="middle" class="small">untrusted, maybe obedient</text>
  <line x1="790" y1="290" x2="742" y2="290" stroke="#c0531f" stroke-width="1.6" marker-end="url(#arrRed)"/>

  <!-- Parser -->
  <rect x="250" y="250" width="270" height="200" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="2"/>
  <rect x="250" y="250" width="270" height="32" rx="8" fill="#2b5fa8"/>
  <rect x="250" y="270" width="270" height="12" fill="#2b5fa8"/>
  <text x="264" y="271" class="white">LlmOutputParser (shared, src/main)</text>
  <text x="264" y="302" class="small" font-weight="600">1. size: 1 – 20 000 characters</text>
  <text x="264" y="322" class="small" font-weight="600">2. strict Jackson refuses:</text>
  <text x="278" y="340" class="code" style="font-size:11px">unknown field · duplicate key</text>
  <text x="278" y="356" class="code" style="font-size:11px">enum by number · "true" as string</text>
  <text x="278" y="372" class="code" style="font-size:11px">trailing JSON · unknown enum</text>
  <text x="264" y="394" class="small" font-weight="600">3. Bean Validation: @NotNull, @Size</text>
  <text x="264" y="414" class="small" font-weight="600">4. error message: field names only,</text>
  <text x="278" y="432" class="small">never the model's text</text>
  <line x1="560" y1="290" x2="522" y2="300" stroke="#c0531f" stroke-width="1.6" marker-end="url(#arrRed)"/>

  <!-- Outcomes -->
  <rect x="24" y="262" width="180" height="62" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.5"/>
  <text x="114" y="287" text-anchor="middle" font-weight="600" style="fill:#2b5fa8">validated record T</text>
  <text x="114" y="306" text-anchor="middle" class="small">never null</text>
  <line x1="250" y1="300" x2="206" y2="296" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="24" y="376" width="180" height="62" rx="8" fill="#ffffff" stroke="#17191e" stroke-width="1.5"/>
  <text x="114" y="400" text-anchor="middle" class="code" font-weight="600">LlmException</text>
  <text x="114" y="419" text-anchor="middle" class="small">checked: INVALID_OUTPUT,</text>
  <text x="114" y="433" text-anchor="middle" class="small">TIMEOUT, UNAVAILABLE</text>
  <line x1="250" y1="410" x2="206" y2="408" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="24" y="474" width="180" height="50" rx="8" fill="#2f7d4f"/>
  <text x="114" y="496" text-anchor="middle" class="white">Escalate to the owner</text>
  <text x="114" y="513" text-anchor="middle" class="wsmall">fail closed (orchestrator, L05)</text>
  <line x1="114" y1="438" x2="114" y2="472" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Note -->
  <text x="560" y="372" class="muted">Measured while preparing this lesson:</text>
  <text x="560" y="391" class="muted">with Quarkus's lenient default mapper,</text>
  <text x="560" y="410" class="muted">5 of the 10 attack outputs were accepted.</text>
  <text x="560" y="429" class="muted">With the strict mapper: 0 of 10.</text>
</svg>
