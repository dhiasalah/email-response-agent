<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Lesson 02: OllamaLlmClient call loop</title>
  <desc id="d">An agent calls OllamaLlmClient with an LlmRequest and an output type. The client picks the fast or strong model from the tier, builds a JSON schema from the output type, sends instructions as the system message and the email as the user message to Ollama on 127.0.0.1, and passes the raw answer to the strict parser. If the parser refuses, the client retries once with a note naming the rejected fields; a second refusal throws INVALID_OUTPUT. Timeouts throw TIMEOUT, other failures UNAVAILABLE. Every failure leads to escalation.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", system-ui, sans-serif; fill: #17191e; font-size: 13px; }
      .h { font-size: 20px; font-weight: 600; }
      .sub { font-size: 13px; fill: #62666f; }
      .code { font-family: Consolas, monospace; font-size: 12px; }
      .white { fill: #ffffff; font-weight: 600; }
      .wsmall { fill: #ffffff; font-size: 11.5px; }
      .small { font-size: 11.5px; }
      .lbl { font-size: 12px; fill: #62666f; font-style: italic; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17191e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0531f"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fbeee6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c0531f" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="960" height="520" fill="#fffefb"/>
  <text x="24" y="36" class="h">Lesson 02: one call, at most two attempts, always a typed result or a typed failure</text>
  <text x="24" y="58" class="sub">OllamaLlmClient is the only class in the project that talks to the model.</text>

  <rect x="24" y="96" width="160" height="64" rx="8" fill="#6b4fa0"/>
  <text x="104" y="123" text-anchor="middle" class="white">Agent</text>
  <text x="104" y="142" text-anchor="middle" class="wsmall">call(request, Type.class)</text>

  <!-- client box -->
  <rect x="220" y="84" width="440" height="300" rx="10" fill="#ffffff" stroke="#2b5fa8" stroke-width="2"/>
  <text x="236" y="108" font-weight="600" style="fill:#2b5fa8">OllamaLlmClient (src/main/…/llm)</text>
  <line x1="184" y1="128" x2="218" y2="128" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="240" y="122" width="190" height="44" rx="6" fill="#eef3fa" stroke="#2b5fa8"/>
  <text x="252" y="141" class="small" font-weight="600">1. tier → model</text>
  <text x="252" y="158" class="code" style="font-size:10.5px">FAST → default, STRONG → strong</text>

  <rect x="450" y="122" width="190" height="44" rx="6" fill="#eef3fa" stroke="#2b5fa8"/>
  <text x="462" y="141" class="small" font-weight="600">2. Type.class → JSON schema</text>
  <text x="462" y="158" class="code" style="font-size:11px">enums, required fields</text>

  <rect x="240" y="182" width="400" height="58" rx="6" fill="#eef3fa" stroke="#2b5fa8"/>
  <text x="252" y="201" class="small" font-weight="600">3. two separate messages</text>
  <rect x="252" y="208" width="180" height="24" rx="4" fill="#2b5fa8"/>
  <text x="262" y="225" class="code" style="fill:#fff">system: instructions</text>
  <rect x="444" y="208" width="186" height="24" rx="4" fill="url(#hatch)" stroke="#c0531f"/>
  <text x="454" y="225" class="code" style="fill:#c0531f">user: untrustedInput</text>

  <rect x="240" y="256" width="190" height="52" rx="6" fill="#eef3fa" stroke="#2b5fa8"/>
  <text x="252" y="276" class="small" font-weight="600">5. LlmOutputParser.parse</text>
  <text x="252" y="295" class="small">strict Jackson + validation</text>

  <rect x="450" y="256" width="190" height="52" rx="6" fill="#ffffff" stroke="#17191e" stroke-dasharray="5 3"/>
  <text x="462" y="276" class="small" font-weight="600">refused, attempt 1?</text>
  <text x="462" y="295" class="small">retry once + "fields X rejected"</text>
  <line x1="430" y1="282" x2="448" y2="282" stroke="#17191e" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M545,256 C545,246 545,246 545,242" stroke="#17191e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="552" y="252" class="lbl">back to 3</text>

  <rect x="240" y="324" width="400" height="44" rx="6" fill="#ffffff" stroke="#17191e"/>
  <text x="252" y="343" class="small" font-weight="600">failures are typed: 2nd refusal → INVALID_OUTPUT</text>
  <text x="252" y="360" class="small">TimeoutException → TIMEOUT · anything else → UNAVAILABLE</text>

  <!-- Ollama -->
  <rect x="720" y="170" width="210" height="84" rx="8" fill="#6b4fa0"/>
  <text x="825" y="198" text-anchor="middle" class="white">Ollama on 127.0.0.1</text>
  <text x="825" y="218" text-anchor="middle" class="wsmall">qwen2.5:7b for both tiers</text>
  <text x="825" y="236" text-anchor="middle" class="wsmall">temperature 0 · timeout 120 s</text>
  <line x1="640" y1="211" x2="718" y2="211" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="679" y="203" text-anchor="middle" class="lbl">4. chat</text>

  <rect x="720" y="276" width="210" height="44" rx="8" fill="url(#hatch)" stroke="#c0531f" stroke-width="1.5"/>
  <text x="825" y="303" text-anchor="middle" font-weight="600" style="fill:#c0531f">raw text (untrusted)</text>
  <line x1="825" y1="254" x2="825" y2="274" stroke="#c0531f" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <path d="M720,298 C680,298 470,318 430,296" stroke="#c0531f" stroke-width="1.5" fill="none" marker-end="url(#arrRed)"/>

  <!-- outputs -->
  <rect x="24" y="250" width="160" height="56" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.5"/>
  <text x="104" y="274" text-anchor="middle" font-weight="600" style="fill:#2b5fa8">valid record</text>
  <text x="104" y="292" text-anchor="middle" class="small">back to the agent</text>
  <line x1="240" y1="282" x2="186" y2="280" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="24" y="420" width="160" height="56" rx="8" fill="#2f7d4f"/>
  <text x="104" y="444" text-anchor="middle" class="white">Escalate to owner</text>
  <text x="104" y="462" text-anchor="middle" class="wsmall">fail closed</text>
  <path d="M240,346 C150,360 104,380 104,418" stroke="#17191e" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="140" y="392" class="lbl">LlmException</text>

  <text x="240" y="420" class="small" font-weight="600">Not given to the model, on purpose:</text>
  <text x="240" y="440" class="small">no @Tool, no AI service with tools, no memory between calls, no access to the database.</text>
  <text x="240" y="460" class="small">The model receives text and returns text. Code decides everything else.</text>
</svg>
