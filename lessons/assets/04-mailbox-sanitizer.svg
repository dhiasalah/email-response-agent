<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">Lesson 04: mailbox import, pre-filter and sanitizer</title>
  <desc id="d">The mock mailbox delivers raw untrusted emails. For each email, in its own transaction, the importer skips duplicates by message id, then the deterministic pre-filter drops auto-replies, mailing lists, no-reply senders, the owner's own address, oversized emails and floods; those are stored as FILTERED_OUT with a reason and no body. The rest go through the sanitizer, which removes scripts, hidden HTML, invisible and bidi Unicode characters and control characters, folds look-alike characters, caps the length, and records flags. The clean email is stored with status NEW, and each decision is written to the append-only decision log. No LLM is involved in this stage.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", system-ui, sans-serif; fill: #17191e; font-size: 13px; }
      .h { font-size: 20px; font-weight: 600; }
      .sub { font-size: 13px; fill: #62666f; }
      .white { fill: #ffffff; font-weight: 600; }
      .wsmall { fill: #ffffff; font-size: 11.5px; }
      .small { font-size: 11.5px; }
      .code { font-family: Consolas, monospace; font-size: 11.5px; }
      .lbl { font-size: 12px; fill: #62666f; font-style: italic; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17191e"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fbeee6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c0531f" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#fffefb"/>
  <text x="24" y="36" class="h">Lesson 04: clean the input before any model reads it</text>
  <text x="24" y="58" class="sub">Pure code, no LLM: deterministic, cheap, and impossible to talk out of its rules. One transaction per email.</text>

  <rect x="24" y="96" width="170" height="96" rx="8" fill="url(#hatch)" stroke="#c0531f" stroke-width="1.5"/>
  <text x="109" y="122" text-anchor="middle" font-weight="600" style="fill:#c0531f">Mailbox</text>
  <text x="109" y="142" text-anchor="middle" class="small">MockMailbox: JSON</text>
  <text x="109" y="158" text-anchor="middle" class="small">headers, HTML, names:</text>
  <text x="109" y="174" text-anchor="middle" class="small">all untrusted</text>

  <rect x="230" y="96" width="150" height="96" rx="8" fill="#2b5fa8"/>
  <text x="305" y="124" text-anchor="middle" class="white">1. Duplicate?</text>
  <text x="305" y="146" text-anchor="middle" class="wsmall">same message_id</text>
  <text x="305" y="162" text-anchor="middle" class="wsmall">already stored →</text>
  <text x="305" y="178" text-anchor="middle" class="wsmall">skip (idempotence)</text>
  <line x1="194" y1="144" x2="228" y2="144" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="416" y="96" width="220" height="186" rx="8" fill="#2b5fa8"/>
  <text x="526" y="122" text-anchor="middle" class="white">2. PreFilter (rules)</text>
  <text x="430" y="146" class="wsmall">• own address → OWN_ADDRESS</text>
  <text x="430" y="164" class="wsmall">• Auto-Submitted, Precedence,</text>
  <text x="440" y="180" class="wsmall">"Réponse automatique"</text>
  <text x="440" y="196" class="wsmall">→ AUTO_REPLY</text><text x="430" y="214" class="wsmall">• List-Id → MAILING_LIST</text>
  <text x="430" y="232" class="wsmall">• no-reply@ → NO_REPLY_SENDER</text>
  <text x="430" y="250" class="wsmall">• &gt; 200 000 chars → TOO_LARGE</text>
  <text x="430" y="268" class="wsmall">• ≥ 10 / hour / sender → RATE_LIMITED</text>
  <line x1="380" y1="144" x2="414" y2="144" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="672" y="96" width="264" height="196" rx="8" fill="#2b5fa8"/>
  <text x="804" y="122" text-anchor="middle" class="white">3. Sanitizer (jsoup + Unicode)</text>
  <text x="686" y="146" class="wsmall">• drop script, style, iframe…</text>
  <text x="686" y="164" class="wsmall">• drop hidden HTML: display:none,</text>
  <text x="696" y="180" class="wsmall">white text, font-size:0 → hidden_html</text>
  <text x="686" y="198" class="wsmall">• NFKC: fullwidth "ｉｇｎｏｒｅ" → "ignore"</text>
  <text x="686" y="216" class="wsmall">• remove zero-width → invisible_unicode</text>
  <text x="686" y="234" class="wsmall">• bidi overrides → bidi_control</text>
  <text x="686" y="252" class="wsmall">• Cyrillic in Latin word → mixed_scripts</text>
  <text x="686" y="270" class="wsmall">• control chars removed · max 20 000 chars</text>
  <line x1="636" y1="144" x2="670" y2="144" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="653" y="136" text-anchor="middle" class="lbl">pass</text>

  <rect x="416" y="330" width="220" height="70" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="526" y="354" text-anchor="middle" font-weight="600">email: FILTERED_OUT</text>
  <text x="526" y="372" text-anchor="middle" class="small">filter_reason set · body NOT stored</text>
  <text x="526" y="388" text-anchor="middle" class="small">(CHECK: status ⇔ reason)</text>
  <line x1="526" y1="282" x2="526" y2="328" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="534" y="304" class="lbl">drop</text>

  <rect x="672" y="330" width="264" height="70" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="804" y="354" text-anchor="middle" font-weight="600">email: NEW</text>
  <text x="804" y="372" text-anchor="middle" class="small">clean text body + sanitizer_flags</text>
  <text x="804" y="388" text-anchor="middle" class="small">→ triage + detector (lessons 05, 06)</text>
  <line x1="804" y1="292" x2="804" y2="328" stroke="#17191e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="416" y="430" width="520" height="40" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="676" y="455" text-anchor="middle" class="small">decision_log (append-only): one "prefilter" row per email, with the reason or the flags</text>
  <line x1="526" y1="400" x2="526" y2="428" stroke="#17191e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="804" y1="400" x2="804" y2="428" stroke="#17191e" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="24" y="240" class="small" font-weight="600">Demo inbox (12 fake emails):</text>
  <text x="24" y="260" class="small">8 → NEW (questions + attacks)</text>
  <text x="24" y="278" class="small">4 filtered (auto-reply, list,</text>
  <text x="24" y="294" class="small">no-reply, own address)</text>
  <text x="24" y="314" class="small">m07: hidden HTML injection</text>
  <text x="24" y="332" class="small">m08: zero-width + bidi +</text>
  <text x="24" y="348" class="small">"рrof." with a Cyrillic р</text>
  <text x="24" y="368" class="small">m09, m10: personal grade,</text>
  <text x="24" y="384" class="small">legal complaint (for lesson 06)</text>
</svg>
