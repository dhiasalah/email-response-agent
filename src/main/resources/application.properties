# --- App settings (env vars override, e.g. SEND_MODE=auto) ---
emailagent.send-mode=${SEND_MODE:draft}
emailagent.owner-address=${OWNER_ADDRESS:prof.martin@univ.example}
emailagent.orchestrator-every=${ORCHESTRATOR_EVERY:30s}
# Tests drive the orchestrator themselves; a background tick would race with them
%test.quarkus.scheduler.enabled=false

# --- Local LLM (Ollama) ---
quarkus.langchain4j.ollama.base-url=${OLLAMA_HOST:http://127.0.0.1:11434}
# Model tiers: the default model is FAST, the named "strong" model is STRONG.
# On a low-RAM PC: FAST_MODEL=qwen2.5:3b (after "ollama pull qwen2.5:3b").
quarkus.langchain4j.ollama.chat-model.model-id=${FAST_MODEL:qwen2.5:7b}
quarkus.langchain4j.ollama.strong.base-url=${OLLAMA_HOST:http://127.0.0.1:11434}
quarkus.langchain4j.ollama.strong.chat-model.model-id=${STRONG_MODEL:qwen2.5:7b}
quarkus.langchain4j.ollama.strong.chat-model.temperature=0
quarkus.langchain4j.ollama.strong.timeout=120s
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.embedding-model.model-id=${EMBED_MODEL:nomic-embed-text}
quarkus.langchain4j.ollama.timeout=120s
quarkus.langchain4j.ollama.devservices.enabled=false
# Never write prompts or answers (= student emails) to the logs
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false

# --- Database: Dev Services starts PostgreSQL in Docker for dev and test ---
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# --- HTTP: listen on this machine only ---
quarkus.http.host=127.0.0.1

# --- Review panel (design doc §10): one owner, form login, deny by default, CSRF, security headers ---
# The owner's PBKDF2 hash (java src/main/java/com/emailagent/web/PasswordHash.java '<password>'); unset = no login
emailagent.owner-password-hash=${OWNER_PASSWORD_HASH:}
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/panel
quarkus.http.auth.form.timeout=PT30M
quarkus.http.auth.form.new-cookie-interval=PT1M
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
# everything needs the owner except the login page and its stylesheet
quarkus.http.auth.permission.public.paths=/login,/j_security_check,/panel.css
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.owner.paths=/*
quarkus.http.auth.permission.owner.policy=authenticated
# no script at all, no framing, no inline style, forms only to ourselves
quarkus.http.header."Content-Security-Policy".value=default-src 'none'; style-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Cache-Control".value=no-store

# --- Hardening and GDPR (design doc §13) ---
# any email address that slips into a log line is replaced by [email]
quarkus.log.console.filter=pii-redactor
emailagent.retention-days=${RETENTION_DAYS:365}
