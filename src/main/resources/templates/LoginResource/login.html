<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Email agent</title>
  <link rel="stylesheet" href="/panel.css">
</head>
<body class="login-page">
<main class="login">
  <div class="brand">
    <span class="brand-mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
    <span class="brand-text"><strong>Email agent</strong><span>Owner review</span></span>
  </div>
  <h1>Sign in</h1>
  <p>The review panel for the mailbox owner.</p>
  {#if error}
  <p class="flash error" role="alert">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
    <span>Wrong username or password, or too many attempts: wait a few minutes.</span></p>
  {/if}
  <form method="post" action="/j_security_check">
    <label class="field"><span>Username</span><input name="j_username" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input name="j_password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="foot"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    The model runs on this machine: student emails are never sent to an AI provider.</p>
</main>
</body>
</html>
